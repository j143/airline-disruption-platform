[project]
name = "airline-disruption-platform"
version = "0.1.0"
description = "Airline reservation and disruption management platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "asyncpg>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
