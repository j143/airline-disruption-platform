services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/airline
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  outbox-relay:
    build: .
    command: python -m app.workers
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/airline
    depends_on:
      db:
        condition: service_healthy
